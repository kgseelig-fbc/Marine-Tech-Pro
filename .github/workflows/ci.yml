name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # `npm run check` syntax-checks every shipped JS file (server, lib/,
      # scripts/, public/js/ and the service worker — a stray character in
      # common.js breaks sign-out on every page and no test would load it),
      # parses the inline <script> blocks in the HTML pages (where most of the
      # browser code actually lives, and which `node --check` cannot see into),
      # then validates the hand-maintained diagnostic trees, fault codes and
      # specs: broken node references and dead ends are otherwise invisible
      # until a technician hits one in the field. One script, so this list and
      # package.json cannot drift apart.
      - name: Syntax check + validate domain data
        run: npm run check

      - name: Tests
        run: node --test test/*.test.js

      # Fails on high/critical only — moderates are reported but don't block.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
