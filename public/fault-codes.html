<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0B2240">
    <title>Fault Codes — Marine Tech Pro</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icons/fbc-logo.jpeg">
    <link rel="apple-touch-icon" href="/icons/fbc-logo.jpeg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .top-bar-logo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 8px;
            vertical-align: middle;
        }

        .search-container {
            margin: 0 16px 16px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 18px 14px 44px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
        }

        .search-input:focus {
            border-color: #1a3a5c;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #667883;
        }

        .search-clear {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            border-radius: 50%;
            /* 44px minimum touch target — wet hands, gloves, moving boat. */
            width: 44px;
            height: 44px;
            font-size: 16px;
            color: #5a6b75;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .search-clear:hover { background: #eef1f4; }

        .filter-row {
            display: flex;
            gap: 8px;
            margin: 0 16px 16px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            border-radius: 20px;
            background: #fff;
            font-size: 13px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .filter-btn.active {
            background: #1a3a5c;
            color: #fff;
            border-color: #1a3a5c;
        }

        .results-count {
            margin: 0 16px 12px;
            font-size: 13px;
            color: #667883;
            font-weight: 600;
        }

        .fault-card {
            background: #fff;
            margin: 0 16px 12px;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            border: 1px solid #eee;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .fault-card:active {
            border-color: #2980b9;
        }

        .fault-card.expanded {
            border-color: #1a3a5c;
        }

        .fault-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .fault-code-badge {
            background: #1a3a5c;
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 800;
            font-family: 'SF Mono', 'Consolas', monospace;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .fault-code-badge.mercury { background: #1a3a5c; }
        .fault-code-badge.yamaha { background: #c0392b; }

        .fault-summary {
            flex: 1;
        }

        .fault-title {
            font-size: 15px;
            font-weight: 700;
            color: #2c3e50;
            line-height: 1.3;
        }

        .fault-brand {
            font-size: 12px;
            color: #667883;
            margin-top: 2px;
        }

        .fault-expand-icon {
            font-size: 18px;
            color: #ccc;
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .fault-card.expanded .fault-expand-icon {
            transform: rotate(90deg);
        }

        .fault-details {
            display: none;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #eee;
        }

        .fault-card.expanded .fault-details {
            display: block;
        }

        .detail-section {
            margin-bottom: 12px;
        }

        .detail-label {
            font-size: 12px;
            font-weight: 700;
            color: #1a3a5c;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .detail-text {
            font-size: 14px;
            color: #2c3e50;
            line-height: 1.6;
        }

        .severity-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .severity-badge.warning { background: #fef3e2; color: #b8860b; }
        .severity-badge.alarm { background: #fde8e8; color: #c0392b; }
        .severity-badge.shutdown { background: #e74c3c; color: #fff; }

        .cause-list, .fix-list {
            margin: 0;
            padding: 0 0 0 16px;
            font-size: 14px;
            color: #2c3e50;
            line-height: 1.8;
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #667883;
        }

        .no-results-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .no-results-text {
            font-size: 16px;
            font-weight: 600;
        }

        .no-results-hint {
            font-size: 14px;
            margin-top: 8px;
        }

        .severity-filter-row {
            display: flex;
            gap: 6px;
            margin: 0 16px 16px;
            flex-wrap: wrap;
        }

        .sev-filter {
            /* Was ~29px tall — under the 44px touch minimum for field use. */
            min-height: 44px;
            padding: 10px 16px;
            border: 1px solid #ddd;
            border-radius: 22px;
            background: #fff;
            font-size: 13px;
            font-weight: 600;
            color: #34495e;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .sev-filter.active { border-color: #1a3a5c; background: #e3f0fc; color: #1a3a5c; }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <header class="top-bar">
        <a href="index.html" class="back-link">
            <svg class="icon icon-sm"><use href="/icons/sprite.svg#i-arrow-left"/></svg>
            Home
        </a>
        <h1>
            <span class="brand-dot"><svg class="icon icon-sm"><use href="/icons/sprite.svg#i-alert"/></svg></span>
            Fault Codes
        </h1>
        <span style="width:60px"></span>
    </header>

    <h2 class="page-title">Fault Code Lookup</h2>
    <p class="page-subtitle">Search Mercury SmartCraft &amp; Yamaha DTC codes</p>

    <!-- SEARCH -->
    <div class="search-container">
        <span class="search-icon">&#128269;</span>
        <input type="text" class="search-input" id="searchInput" placeholder="Search code, keyword, or symptom..." autocomplete="off">
        <button class="search-clear" id="searchClear" onclick="clearSearch()">&#10005;</button>
    </div>

    <!-- BRAND FILTER -->
    <div class="filter-row">
        <button class="filter-btn active" id="filterAll" onclick="setFilter('all')">All Codes</button>
        <button class="filter-btn" id="filterMercury" onclick="setFilter('mercury')">Mercury</button>
        <button class="filter-btn" id="filterYamaha" onclick="setFilter('yamaha')">Yamaha</button>
    </div>

    <!-- SEVERITY FILTER -->
    <div class="severity-filter-row">
        <button class="sev-filter active" onclick="setSeverity('all', this)">All Severity</button>
        <button class="sev-filter" onclick="setSeverity('Shutdown', this)">&#128308; Shutdown</button>
        <button class="sev-filter" onclick="setSeverity('Alarm', this)">&#128992; Alarm</button>
        <button class="sev-filter" onclick="setSeverity('Warning', this)">&#128993; Warning</button>
    </div>

    <div class="results-count" id="resultsCount"></div>

    <!-- RESULTS -->
    <div id="faultResults"></div>

    <div style="text-align:center; padding:20px; margin-bottom:20px;">
        <a href="index.html" style="color:#95a5a6; font-size:13px; text-decoration:none;">&#8592; Back to Home</a>
    </div>

    <!-- Single source of truth: the same database that grounds the Ask-a-Tech AI -->
    <script src="js/faultcodes.js"></script>
    <script>

    // =============================================
    // SEARCH & FILTER ENGINE
    // =============================================

    var faultCodes = window.faultCodeDatabase || [];

    var currentFilter = 'all';
    var currentSeverity = 'all';

    function esc(s) {
        if (s == null) return '';
        return String(s).replace(/[&<>"']/g, function(c){
            return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
        });
    }

    document.getElementById('searchInput').addEventListener('input', renderResults);

    function clearSearch() {
        document.getElementById('searchInput').value = '';
        document.getElementById('searchClear').style.display = 'none';
        renderResults();
    }

    function setFilter(brand) {
        currentFilter = brand;
        document.querySelectorAll('.filter-btn').forEach(function(btn) { btn.className = 'filter-btn'; });
        document.getElementById('filter' + brand.charAt(0).toUpperCase() + brand.slice(1)).className = 'filter-btn active';
        renderResults();
    }

    function setSeverity(sev, clicked) {
        currentSeverity = sev;
        document.querySelectorAll('.sev-filter').forEach(function(btn) { btn.className = 'sev-filter'; });
        clicked.className = 'sev-filter active';
        renderResults();
    }

    function toggleCard(id) {
        var card = document.getElementById(id);
        var open = card.classList.toggle('expanded');
        card.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    // Cards are role="button" — Enter and Space must activate them.
    function cardKey(e, id) {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
            e.preventDefault();
            toggleCard(id);
        }
    }

    var _faultSearchTimer = null;
    // Shared implementation lives in js/common.js (MTP.beacon).
    function mtpBeacon(kind, data) { if (window.MTP) MTP.beacon(kind, data); }

    function renderResults() {
        var query = document.getElementById('searchInput').value.trim().toLowerCase();
        var clearBtn = document.getElementById('searchClear');
        clearBtn.style.display = query ? 'flex' : 'none';

        if (query) {
            clearTimeout(_faultSearchTimer);
            _faultSearchTimer = setTimeout(function(){
                mtpBeacon('fault_lookup', { q: query.slice(0,80), brand: currentFilter, severity: currentSeverity });
            }, 700);
        }

        var filtered = faultCodes.filter(function(fc) {
            if (currentFilter !== 'all' && fc.manufacturer.toLowerCase() !== currentFilter) return false;
            if (currentSeverity !== 'all' && fc.severity !== currentSeverity) return false;
            if (!query) return true;
            var searchable = (fc.code + ' ' + fc.description + ' ' + fc.system + ' '
                + fc.causes + ' ' + fc.steps + ' ' + fc.tools + ' ' + fc.parts).toLowerCase();
            return searchable.indexOf(query) !== -1;
        });

        var countEl = document.getElementById('resultsCount');
        countEl.textContent = filtered.length + ' code' + (filtered.length !== 1 ? 's' : '') + ' found';

        if (filtered.length === 0) {
            document.getElementById('faultResults').innerHTML =
                '<div class="no-results">' +
                '<div class="no-results-icon">&#128269;</div>' +
                '<div class="no-results-text">No codes found</div>' +
                '<div class="no-results-hint">Try a different search term or adjust filters</div>' +
                '</div>';
            return;
        }

        var sevOrder = { Shutdown: 0, Alarm: 1, Warning: 2 };
        filtered.sort(function(a, b) {
            return (sevOrder[a.severity] !== undefined ? sevOrder[a.severity] : 9)
                 - (sevOrder[b.severity] !== undefined ? sevOrder[b.severity] : 9);
        });

        var html = '';
        for (var i = 0; i < filtered.length; i++) {
            var fc = filtered[i];
            var cardId = 'fc_' + i;
            var brand = (fc.manufacturer || '').toLowerCase();
            var causes = (fc.causes || '').split('|').filter(Boolean);
            var steps = (fc.steps || '').split('|').filter(Boolean);

            html += '<div class="fault-card" id="' + cardId + '" role="button" tabindex="0"'
                  + ' aria-expanded="false" onclick="toggleCard(\'' + cardId + '\')"'
                  + ' onkeydown="cardKey(event, \'' + cardId + '\')">';
            html += '<div class="fault-header">';
            html += '<span class="fault-code-badge ' + esc(brand) + '">' + esc(fc.code) + '</span>';
            html += '<div class="fault-summary">';
            html += '<div class="fault-title">' + esc(fc.description) + '</div>';
            html += '<div class="fault-brand">' + esc(fc.manufacturer) + (fc.system ? ' &middot; ' + esc(fc.system) : '') + '</div>';
            html += '</div>';
            html += '<span class="fault-expand-icon">&#8250;</span>';
            html += '</div>';

            html += '<div class="fault-details">';

            html += '<div class="detail-section">';
            html += '<span class="severity-badge ' + esc((fc.severity || '').toLowerCase()) + '">' + esc(fc.severity) + '</span>';
            html += '</div>';

            html += '<div class="detail-section">';
            html += '<div class="detail-label">Common Causes</div>';
            html += '<ul class="cause-list">';
            for (var c = 0; c < causes.length; c++) {
                html += '<li>' + esc(causes[c]) + '</li>';
            }
            html += '</ul></div>';

            html += '<div class="detail-section">';
            html += '<div class="detail-label">Diagnostic Steps</div>';
            html += '<ol class="fix-list">';
            for (var f = 0; f < steps.length; f++) {
                // Entries carry their own "Step N:" prefix — the <ol> numbers them.
                html += '<li>' + esc(steps[f].replace(/^\s*Step \d+:\s*/, '')) + '</li>';
            }
            html += '</ol></div>';

            if (fc.tools) {
                html += '<div class="detail-section">';
                html += '<div class="detail-label">Tools Needed</div>';
                html += '<div class="detail-text">' + esc(fc.tools) + '</div>';
                html += '</div>';
            }

            if (fc.parts) {
                html += '<div class="detail-section">';
                html += '<div class="detail-label">Parts Commonly Needed</div>';
                html += '<div class="detail-text">' + esc(fc.parts) + '</div>';
                html += '</div>';
            }

            html += '</div>';
            html += '</div>';
        }

        document.getElementById('faultResults').innerHTML = html;
    }

    renderResults();

    </script>
    <script src="/js/common.js"></script>
    <script src="/js/askTech.js"></script>
    <script src="/js/feedback.js"></script>

</body>
</html>
